name: Devless Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Register webhook
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WEBHOOK_SECRET: ${{ secrets.DEVLESS_WEBHOOK_SECRET }}
          API_URL: ${{ secrets.DEVLESS_API_URL }}
        run: |
          REPO="${GITHUB_REPOSITORY}"

          EXISTING=$(curl -s -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/hooks")

          HOOK_ID=$(echo "${EXISTING}" | jq -r \
            --arg url "${API_URL}" \
            '.[] | select(.config.url == $url) | .id' | head -n1)

          PAYLOAD=$(jq -n \
            --arg url "${API_URL}" \
            --arg secret "${WEBHOOK_SECRET}" \
            '{
              "name": "web",
              "active": true,
              "events": ["issues", "issue_comment", "check_run"],
              "config": {
                "url": $url,
                "content_type": "json",
                "secret": $secret,
                "insecure_ssl": "0"
              }
            }')

          if [ -n "${HOOK_ID}" ] && [ "${HOOK_ID}" != "null" ]; then
            echo "Updating webhook ${HOOK_ID}..."
            curl -s -X PATCH \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/hooks/${HOOK_ID}" \
              -d "${PAYLOAD}" > /dev/null
          else
            echo "Creating webhook..."
            curl -s -X POST \
              -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/hooks" \
              -d "${PAYLOAD}" > /dev/null
          fi
          echo "Done."
